[project]
name = "flights"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mateusz Janusz", email = "januszmateusz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
integration = ["pyspark"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "integration: tests touching real resources (files on disk, databases)",
    "slow: tests taking more than ~1 second",
]
xfail_strict = true

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src,tests"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pyspark", "pyspark.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["flights"]