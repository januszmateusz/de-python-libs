[project]
name = "de-python-libs"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mateusz Janusz", email = "januszmateusz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "tracks/01-pytest-pydantic",
]
